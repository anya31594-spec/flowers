<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Магічний сад лілій</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b0c26 0%, #08030c 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .hint {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 230, 245, 0.75);
      font-size: 14px;
      letter-spacing: 1.2px;
      text-align: center;
      pointer-events: none;
      animation: pulse 2s infinite ease-in-out;
      text-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: translateX(-50%) scale(0.98); }
      50% { opacity: 0.95; transform: translateX(-50%) scale(1.02); }
    }
  </style>
</head>
<body>

  <canvas id="lilyCanvas"></canvas>
  <div class="hint">Торкніться екрана, щоб додати світла ✨</div>

  <script>
    const canvas = document.getElementById('lilyCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let flowers = [];
    let particles = [];
    let touchParticles = [];
    let time = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initScene();
    }

    class Lily {
      constructor(x, y, scale, angleOffset, bloomSpeed) {
        this.x = x;
        this.y = y;
        this.baseScale = scale;
        this.scale = 0;
        this.targetScale = scale;
        this.angleOffset = angleOffset;
        this.bloomSpeed = bloomSpeed;
        this.swaySpeed = 0.015 + Math.random() * 0.01;
        this.swayAmp = 0.05 + Math.random() * 0.04;
        this.stemPoints = [];
        this.generateStem();
      }

      generateStem() {
        this.stemPoints = [];
        const segments = 12;
        const startY = height + 20;
        const endY = this.y;
        
        for (let i = 0; i <= segments; i++) {
          let t = i / segments;
          let currY = startY + (endY - startY) * t;
          let currX = this.x + Math.sin(t * Math.PI + this.angleOffset) * 40 * (1 - t);
          this.stemPoints.push({ x: currX, y: currY });
        }
      }

      update() {
        if (this.scale < this.targetScale) {
          this.scale += this.bloomSpeed;
        }
      }

      draw(t) {
        const sway = Math.sin(t * this.swaySpeed + this.angleOffset) * this.swayAmp;
        
        // Стебло
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(this.stemPoints[0].x, this.stemPoints[0].y);
        for (let i = 1; i < this.stemPoints.length; i++) {
          let pt = this.stemPoints[i];
          let offsetX = Math.sin(t * this.swaySpeed + i * 0.2) * (i * 1.5) * sway;
          ctx.lineTo(pt.x + offsetX, pt.y);
        }
        ctx.strokeStyle = '#2d5a27';
        ctx.lineWidth = 6 * this.scale;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Листя на стеблі
        ctx.fillStyle = '#1e441b';
        let leafPt = this.stemPoints[Math.floor(this.stemPoints.length * 0.5)];
        ctx.save();
        ctx.translate(leafPt.x, leafPt.y);
        ctx.rotate(0.5 + sway);
        ctx.beginPath();
        ctx.ellipse(20 * this.scale, 0, 25 * this.scale, 8 * this.scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Квітка
        const topPt = this.stemPoints[this.stemPoints.length - 1];
        ctx.translate(topPt.x + Math.sin(t * this.swaySpeed) * 15 * sway, topPt.y);
        ctx.rotate(sway);
        ctx.scale(this.scale, this.scale);

        // Малювання пелюсток (6 пелюсток біло-рожевої лілії)
        const petals = 6;
        for (let i = 0; i < petals; i++) {
          ctx.save();
          let angle = (i * Math.PI * 2) / petals;
          ctx.rotate(angle);

          // Градієнт пелюстки
          let grad = ctx.createLinearGradient(0, 0, 0, -90);
          grad.addColorStop(0, '#fce4ec');
          grad.addColorStop(0.3, '#f8bbd0');
          grad.addColorStop(0.75, '#ffffff');
          grad.addColorStop(1, '#fff5f8');

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-22, -40, -25, -75, 0, -100);
          ctx.bezierCurveTo(25, -75, 22, -40, 0, 0);
          ctx.fillStyle = grad;
          ctx.shadowColor = 'rgba(233, 30, 99, 0.25)';
          ctx.shadowBlur = 10;
          ctx.fill();

          // Центральна прожилка
          ctx.beginPath();
          ctx.moveTo(0, -5);
          ctx.lineTo(0, -70);
          ctx.strokeStyle = 'rgba(216, 27, 96, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Цятки лілії
          ctx.fillStyle = 'rgba(173, 20, 87, 0.6)';
          for (let j = 0; j < 5; j++) {
            let rx = (Math.random() - 0.5) * 12;
            let ry = -20 - Math.random() * 35;
            ctx.beginPath();
            ctx.arc(rx, ry, 1.2, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }

        // Тичинки та маточка
        const stamens = 6;
        for (let i = 0; i < stamens; i++) {
          ctx.save();
          let stamenAngle = (i * Math.PI * 2) / stamens + 0.5;
          ctx.rotate(stamenAngle);

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(8, -25, 12, -45);
          ctx.strokeStyle = '#dcedc8';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Пильовик (золотистий кінчик)
          ctx.beginPath();
          ctx.ellipse(12, -46, 5, 2.5, 0.8, 0, Math.PI * 2);
          ctx.fillStyle = '#fbc02d';
          ctx.shadowColor = '#fff59d';
          ctx.shadowBlur = 8;
          ctx.fill();

          ctx.restore();
        }

        ctx.restore();
      }
    }

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = 1 + Math.random() * 2.5;
        this.speedY = -0.2 - Math.random() * 0.5;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.alpha = Math.random();
        this.fade = 0.005 + Math.random() * 0.008;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.alpha += this.fade;
        if (this.alpha >= 1 || this.alpha <= 0) this.fade = -this.fade;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = '#fff9c4';
        ctx.shadowColor = '#ffe082';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.restore();
      }
    }

    function initScene() {
      flowers = [];
      particles = [];

      // Кількість квітів адаптується під розмір екрана мобільного/ПК
      const isMobile = width < 768;
      const flowerCount = isMobile ? 11 : 18;

      for (let i = 0; i < flowerCount; i++) {
        let x = (width / (flowerCount + 1)) * (i + 1) + (Math.random() - 0.5) * (isMobile ? 25 : 50);
        let y = height * 0.35 + Math.random() * (height * 0.45);
        let scale = (isMobile ? 0.55 : 0.75) + Math.random() * 0.3;
        let angleOffset = Math.random() * Math.PI * 2;
        let bloomSpeed = 0.01 + Math.random() * 0.015;
        
        flowers.push(new Lily(x, y, scale, angleOffset, bloomSpeed));
      }

      // Сортуємо за висотою для гарного накладання
      flowers.sort((a, b) => a.y - b.y);

      // Світлячки
      for (let i = 0; i < 40; i++) {
        particles.push(new Particle());
      }
    }

    function addTouchSparks(x, y) {
      for (let i = 0; i < 8; i++) {
        touchParticles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          size: 2 + Math.random() * 3,
          life: 1
        });
      }
    }

    function animate() {
      time += 1;
      ctx.clearRect(0, 0, width, height);

      // Фон-сяйво
      let bgGlow = ctx.createRadialGradient(width / 2, height * 0.7, 50, width / 2, height * 0.7, width * 0.8);
      bgGlow.addColorStop(0, 'rgba(74, 20, 140, 0.25)');
      bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = bgGlow;
      ctx.fillRect(0, 0, width, height);

      // Частинки
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      // Квіти
      flowers.forEach(f => {
        f.update();
        f.draw(time);
      });

      // Інтерактивні спалахи при дотику
      for (let i = touchParticles.length - 1; i >= 0; i--) {
        let p = touchParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.025;
        if (p.life <= 0) {
          touchParticles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = '#ff80ab';
        ctx.shadowColor = '#ff4081';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    // Події для смартфона та мишки
    window.addEventListener('resize', resize);
    window.addEventListener('touchstart', (e) => {
      for (let touch of e.touches) {
        addTouchSparks(touch.clientX, touch.clientY);
      }
    });
    window.addEventListener('mousedown', (e) => {
      addTouchSparks(e.clientX, e.clientY);
    });

    // Старт
    resize();
    animate();
  </script>
</body>
</html>
