<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flowers Bouquet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 60%, #1d0f28 0%, #08030b 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>

  <canvas id="bouquetCanvas"></canvas>

  <script>
    const canvas = document.getElementById('bouquetCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let flowers = [];
    let particles = [];
    let touchParticles = [];
    let time = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initBouquet();
    }

    class LilyFlower {
      constructor(targetX, targetY, scale, angle, bloomDelay) {
        this.targetX = targetX;
        this.targetY = targetY;
        this.baseScale = scale;
        this.scale = 0;
        this.targetScale = scale;
        this.angle = angle; // кут нахилу квітки у букеті
        this.bloomDelay = bloomDelay;
        this.bloomTimer = 0;
        this.swaySpeed = 0.012 + Math.random() * 0.008;
        this.swayAmp = 0.03 + Math.random() * 0.02;
      }

      update() {
        if (this.bloomTimer < this.bloomDelay) {
          this.bloomTimer++;
          return;
        }
        if (this.scale < this.targetScale) {
          this.scale += 0.012;
        }
      }

      draw(t, baseX, baseY) {
        if (this.scale <= 0) return;

        const sway = Math.sin(t * this.swaySpeed + this.angle) * this.swayAmp;
        const currentAngle = this.angle + sway;

        // Позиція квітки з урахуванням легкого погодування букета
        const headX = this.targetX + Math.sin(t * 0.01) * 8;
        const headY = this.targetY + Math.cos(t * 0.015) * 5;

        // 1. Малювання вигнутого стебла від основи букета до квітки
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        // Точка вигину для природного вигляду стебла
        let controlX = (baseX + headX) / 2 + Math.sin(this.angle) * 30;
        let controlY = (baseY + headY) / 2;
        ctx.quadraticCurveTo(controlX, controlY, headX, headY);
        
        ctx.strokeStyle = '#234a1f';
        ctx.lineWidth = Math.max(3, 7 * this.scale);
        ctx.lineCap = 'round';
        ctx.stroke();

        // Маленьке листочок біля підніжжя бутона
        ctx.save();
        ctx.translate((baseX + headX) * 0.55, (baseY + headY) * 0.55);
        ctx.rotate(currentAngle + 0.3);
        ctx.fillStyle = '#183815';
        ctx.beginPath();
        ctx.ellipse(0, 0, 18 * this.scale, 6 * this.scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();

        // 2. Малювання квітки лілії
        ctx.save();
        ctx.translate(headX, headY);
        ctx.rotate(currentAngle);
        ctx.scale(this.scale, this.scale);

        // 6 пелюсток
        const petals = 6;
        for (let i = 0; i < petals; i++) {
          ctx.save();
          let pAngle = (i * Math.PI * 2) / petals;
          ctx.rotate(pAngle);

          // Градієнт пелюстки
          let grad = ctx.createLinearGradient(0, 0, 0, -85);
          grad.addColorStop(0, '#fce4ec');
          grad.addColorStop(0.35, '#f8bbd0');
          grad.addColorStop(0.8, '#ffffff');
          grad.addColorStop(1, '#fff5f8');

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-20, -35, -22, -65, 0, -90);
          ctx.bezierCurveTo(22, -65, 20, -35, 0, 0);
          ctx.fillStyle = grad;
          ctx.shadowColor = 'rgba(233, 30, 99, 0.2)';
          ctx.shadowBlur = 8;
          ctx.fill();

          // Прожилка
          ctx.beginPath();
          ctx.moveTo(0, -5);
          ctx.lineTo(0, -65);
          ctx.strokeStyle = 'rgba(216, 27, 96, 0.35)';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // Рожеві цятки лілії
          ctx.fillStyle = 'rgba(173, 20, 87, 0.55)';
          for (let j = 0; j < 4; j++) {
            let rx = (Math.random() - 0.5) * 10;
            let ry = -18 - Math.random() * 30;
            ctx.beginPath();
            ctx.arc(rx, ry, 1, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }

        // 6 тичинок із золотистим пилком
        const stamens = 6;
        for (let i = 0; i < stamens; i++) {
          ctx.save();
          let stamenAngle = (i * Math.PI * 2) / stamens + 0.5;
          ctx.rotate(stamenAngle);

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(6, -22, 10, -40);
          ctx.strokeStyle = '#dcedc8';
          ctx.lineWidth = 1.8;
          ctx.stroke();

          // Пильовик
          ctx.beginPath();
          ctx.ellipse(10, -41, 4.5, 2.2, 0.8, 0, Math.PI * 2);
          ctx.fillStyle = '#fbc02d';
          ctx.shadowColor = '#fff59d';
          ctx.shadowBlur = 6;
          ctx.fill();

          ctx.restore();
        }

        ctx.restore();
      }
    }

    class Firefly {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = 1 + Math.random() * 2.2;
        this.speedY = -0.15 - Math.random() * 0.4;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.alpha = Math.random();
        this.fade = 0.006 + Math.random() * 0.008;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.alpha += this.fade;
        if (this.alpha >= 1 || this.alpha <= 0) this.fade = -this.fade;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = '#fff9c4';
        ctx.shadowColor = '#ffe082';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.restore();
      }
    }

    function initBouquet() {
      flowers = [];
      particles = [];

      const isMobile = width < 768;
      
      // Основа букета (де зв'язані стебла)
      const baseX = width / 2;
      const baseY = height * (isMobile ? 0.85 : 0.88);

      // Радіус розкиду квітів у букеті
      const radiusX = isMobile ? width * 0.38 : Math.min(width * 0.28, 260);
      const radiusY = isMobile ? height * 0.22 : 180;
      const centerY = height * (isMobile ? 0.42 : 0.45);

      const count = isMobile ? 15 : 23;

      for (let i = 0; i < count; i++) {
        // Рівномірний та природний розкид у формі півкола/овалу букета
        let angle = (i / count) * Math.PI * 1.4 - Math.PI * 0.7; // від -126 до +126 градусів
        let distFactor = 0.3 + Math.random() * 0.7;
        
        let targetX = baseX + Math.sin(angle) * radiusX * distFactor;
        let targetY = centerY - Math.cos(angle) * radiusY * distFactor + (Math.random() - 0.5) * 40;
        
        let scale = (isMobile ? 0.5 : 0.65) + Math.random() * 0.25;
        let tiltAngle = angle * 0.6; // нахил квітки вбік від центру
        let delay = Math.floor(Math.random() * 25);

        flowers.push(new LilyFlower(targetX, targetY, scale, tiltAngle, delay));
      }

      // Сортуємо: верхні квіти малюються першими, нижні/передні — поверх них
      flowers.sort((a, b) => a.targetY - b.targetY);

      // Світлячки
      for (let i = 0; i < 35; i++) {
        particles.push(new Firefly());
      }
    }

    // Малювання стрічки/банта, що зв'язує букет
    function drawRibbon(x, y) {
      ctx.save();
      ctx.translate(x, y);

      // Стрічка
      ctx.fillStyle = '#e91e63';
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 6;

      // Вузол
      ctx.beginPath();
      ctx.ellipse(0, 0, 12, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Бант (ліве та праве вушко)
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-20, -15, -30, 5, 0, 0);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(20, -15, 30, 5, 0, 0);
      ctx.fill();

      // Кінці стрічки, що звисають
      ctx.beginPath();
      ctx.moveTo(-2, 2);
      ctx.quadraticCurveTo(-15, 20, -22, 38);
      ctx.lineTo(-12, 38);
      ctx.quadraticCurveTo(-5, 20, 0, 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(2, 2);
      ctx.quadraticCurveTo(15, 20, 22, 38);
      ctx.lineTo(12, 38);
      ctx.quadraticCurveTo(5, 20, 0, 2);
      ctx.fill();

      ctx.restore();
    }

    function addTouchSparks(x, y) {
      for (let i = 0; i < 9; i++) {
        touchParticles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 4.5,
          vy: (Math.random() - 0.5) * 4.5,
          size: 2 + Math.random() * 3,
          life: 1
        });
      }
    }

    function animate() {
      time += 1;
      ctx.clearRect(0, 0, width, height);

      // Фонове м'яке сяйво
      let bgGlow = ctx.createRadialGradient(width / 2, height * 0.5, 30, width / 2, height * 0.5, width * 0.7);
      bgGlow.addColorStop(0, 'rgba(106, 27, 154, 0.22)');
      bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = bgGlow;
      ctx.fillRect(0, 0, width, height);

      // Світлячки
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      const isMobile = width < 768;
      const baseX = width / 2;
      const baseY = height * (isMobile ? 0.85 : 0.88);

      // Квіти та стебла букета
      flowers.forEach(f => {
        f.update();
        f.draw(time, baseX, baseY);
      });

      // Стрічка на основі букета
      drawRibbon(baseX, baseY);

      // Сяючі іскри при дотику
      for (let i = touchParticles.length - 1; i >= 0; i--) {
        let p = touchParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.025;
        if (p.life <= 0) {
          touchParticles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = '#ff80ab';
        ctx.shadowColor = '#ff4081';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('touchstart', (e) => {
      for (let touch of e.touches) {
        addTouchSparks(touch.clientX, touch.clientY);
      }
    });
    window.addEventListener('mousedown', (e) => {
      addTouchSparks(e.clientX, e.clientY);
    });

    resize();
    animate();
  </script>
</body>
</html>
