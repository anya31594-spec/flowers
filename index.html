<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flowers Bouquet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 55%, #231032 0%, #08030b 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>

  <canvas id="bouquetCanvas"></canvas>

  <script>
    const canvas = document.getElementById('bouquetCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let flowers = [];
    let particles = [];
    let touchParticles = [];
    let time = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initBouquet();
    }

    class LilyFlower {
      constructor(targetX, targetY, scale, angle, bloomDelay) {
        this.targetX = targetX;
        this.targetY = targetY;
        this.baseScale = scale;
        this.scale = 0;
        this.targetScale = scale;
        this.angle = angle;
        this.bloomDelay = bloomDelay;
        this.bloomTimer = 0;
        this.swaySpeed = 0.012 + Math.random() * 0.008;
        this.swayAmp = 0.03 + Math.random() * 0.02;
      }

      update() {
        if (this.bloomTimer < this.bloomDelay) {
          this.bloomTimer++;
          return;
        }
        if (this.scale < this.targetScale) {
          this.scale += 0.012;
        }
      }

      draw(t, baseX, baseY) {
        if (this.scale <= 0) return;

        const sway = Math.sin(t * this.swaySpeed + this.angle) * this.swayAmp;
        const currentAngle = this.angle + sway;

        const headX = this.targetX + Math.sin(t * 0.01) * 8;
        const headY = this.targetY + Math.cos(t * 0.015) * 5;

        // Стебло
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        let controlX = (baseX + headX) / 2 + Math.sin(this.angle) * 35;
        let controlY = (baseY + headY) / 2;
        ctx.quadraticCurveTo(controlX, controlY, headX, headY);
        
        ctx.strokeStyle = '#285423';
        ctx.lineWidth = Math.max(3.5, 7.5 * this.scale);
        ctx.lineCap = 'round';
        ctx.stroke();

        // Листочок на стеблі
        ctx.save();
        ctx.translate((baseX + headX) * 0.52, (baseY + headY) * 0.52);
        ctx.rotate(currentAngle + 0.35);
        ctx.fillStyle = '#1c3d19';
        ctx.beginPath();
        ctx.ellipse(0, 0, 22 * this.scale, 7 * this.scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();

        // Квітка
        ctx.save();
        ctx.translate(headX, headY);
        ctx.rotate(currentAngle);
        ctx.scale(this.scale, this.scale);

        const petals = 6;
        for (let i = 0; i < petals; i++) {
          ctx.save();
          let pAngle = (i * Math.PI * 2) / petals;
          ctx.rotate(pAngle);

          let grad = ctx.createLinearGradient(0, 0, 0, -85);
          grad.addColorStop(0, '#fce4ec');
          grad.addColorStop(0.35, '#f8bbd0');
          grad.addColorStop(0.8, '#ffffff');
          grad.addColorStop(1, '#fff5f8');

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-20, -35, -22, -65, 0, -90);
          ctx.bezierCurveTo(22, -65, 20, -35, 0, 0);
          ctx.fillStyle = grad;
          ctx.shadowColor = 'rgba(233, 30, 99, 0.2)';
          ctx.shadowBlur = 8;
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(0, -5);
          ctx.lineTo(0, -65);
          ctx.strokeStyle = 'rgba(216, 27, 96, 0.35)';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          ctx.fillStyle = 'rgba(173, 20, 87, 0.55)';
          for (let j = 0; j < 4; j++) {
            let rx = (Math.random() - 0.5) * 10;
            let ry = -18 - Math.random() * 30;
            ctx.beginPath();
            ctx.arc(rx, ry, 1, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }

        const stamens = 6;
        for (let i = 0; i < stamens; i++) {
          ctx.save();
          let stamenAngle = (i * Math.PI * 2) / stamens + 0.5;
          ctx.rotate(stamenAngle);

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(6, -22, 10, -40);
          ctx.strokeStyle = '#dcedc8';
          ctx.lineWidth = 1.8;
          ctx.stroke();

          ctx.beginPath();
          ctx.ellipse(10, -41, 4.5, 2.2, 0.8, 0, Math.PI * 2);
          ctx.fillStyle = '#fbc02d';
          ctx.shadowColor = '#fff59d';
          ctx.shadowBlur = 6;
          ctx.fill();

          ctx.restore();
        }

        ctx.restore();
      }
    }

    class Firefly {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = 1 + Math.random() * 2.2;
        this.speedY = -0.15 - Math.random() * 0.4;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.alpha = Math.random();
        this.fade = 0.006 + Math.random() * 0.008;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.alpha += this.fade;
        if (this.alpha >= 1 || this.alpha <= 0) this.fade = -this.fade;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = '#fff9c4';
        ctx.shadowColor = '#ffe082';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.restore();
      }
    }

    function initBouquet() {
      flowers = [];
      particles = [];

      const isMobile = width < 768;
      
      const baseX = width / 2;
      const baseY = height * (isMobile ? 0.78 : 0.80);

      const radiusX = isMobile ? width * 0.38 : Math.min(width * 0.28, 270);
      const radiusY = isMobile ? height * 0.22 : 180;
      const centerY = height * (isMobile ? 0.38 : 0.42);

      const count = isMobile ? 15 : 22;

      for (let i = 0; i < count; i++) {
        let angle = (i / count) * Math.PI * 1.35 - Math.PI * 0.675;
        let distFactor = 0.3 + Math.random() * 0.7;
        
        let targetX = baseX + Math.sin(angle) * radiusX * distFactor;
        let targetY = centerY - Math.cos(angle) * radiusY * distFactor + (Math.random() - 0.5) * 35;
        
        let scale = (isMobile ? 0.52 : 0.68) + Math.random() * 0.22;
        let tiltAngle = angle * 0.6;
        let delay = Math.floor(Math.random() * 20);

        flowers.push(new LilyFlower(targetX, targetY, scale, tiltAngle, delay));
      }

      flowers.sort((a, b) => a.targetY - b.targetY);

      for (let i = 0; i < 35; i++) {
        particles.push(new Firefly());
      }
    }

    // НОВИЙ КРАСИВИЙ НИЗ: Шовкова стрічка та ніжне листя
    function drawElegantRibbon(x, y, t) {
      ctx.save();
      ctx.translate(x, y);

      // Нижні стебла під бантиком
      ctx.strokeStyle = '#1e4219';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 4, 0);
        ctx.lineTo(i * 8 + Math.sin(i) * 5, 60 + Math.abs(i) * 4);
        ctx.stroke();
      }

      // Декоративні розкриті листочки біля вузла
      ctx.fillStyle = '#2d5a27';
      ctx.beginPath();
      ctx.ellipse(-25, 5, 25, 8, -0.4, 0, Math.PI * 2);
      ctx.ellipse(25, 5, 25, 8, 0.4, 0, Math.PI * 2);
      ctx.fill();

      // М'яке сяйво за бантом
      let ribbonGlow = ctx.createRadialGradient(0, 0, 5, 0, 0, 45);
      ribbonGlow.addColorStop(0, 'rgba(255, 64, 129, 0.4)');
      ribbonGlow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = ribbonGlow;
      ctx.beginPath();
      ctx.arc(0, 0, 45, 0, Math.PI * 2);
      ctx.fill();

      // Градієнт для вишуканої шовкової стрічки
      let ribbonGrad = ctx.createLinearGradient(-35, -20, 35, 20);
      ribbonGrad.addColorStop(0, '#ff4081');
      ribbonGrad.addColorStop(0.5, '#f50057');
      ribbonGrad.addColorStop(1, '#c2185b');

      // Спадаючі кінці стрічок з легким коливанням від вітру
      const wave1 = Math.sin(t * 0.03) * 6;
      const wave2 = Math.cos(t * 0.025) * 6;

      ctx.fillStyle = ribbonGrad;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
      ctx.shadowBlur = 10;

      // Лівий кінець
      ctx.beginPath();
      ctx.moveTo(-6, 8);
      ctx.bezierCurveTo(-20, 40, -35 + wave1, 70, -25 + wave1, 105);
      ctx.lineTo(-12 + wave1, 102);
      ctx.bezierCurveTo(-20 + wave1, 65, -8, 35, 0, 8);
      ctx.fill();

      // Правий кінець
      ctx.beginPath();
      ctx.moveTo(6, 8);
      ctx.bezierCurveTo(20, 40, 35 + wave2, 75, 28 + wave2, 110);
      ctx.lineTo(15 + wave2, 107);
      ctx.bezierCurveTo(20 + wave2, 70, 8, 35, 0, 8);
      ctx.fill();

      // Вушка банта (ліве та праве)
      // Ліва петля
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-20, -30, -55, -15, -42, 5);
      ctx.bezierCurveTo(-30, 20, -10, 8, 0, 0);
      ctx.fill();

      // Права петля
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(20, -30, 55, -15, 42, 5);
      ctx.bezierCurveTo(30, 20, 10, 8, 0, 0);
      ctx.fill();

      // Внутрішні складки банта для об'єму
      ctx.fillStyle = 'rgba(136, 14, 79, 0.45)';
      ctx.beginPath();
      ctx.ellipse(-22, -4, 12, 5, -0.3, 0, Math.PI * 2);
      ctx.ellipse(22, -4, 12, 5, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Центральний вузол
      let nodeGrad = ctx.createRadialGradient(-3, -3, 1, 0, 0, 14);
      nodeGrad.addColorStop(0, '#ff80ab');
      nodeGrad.addColorStop(0.6, '#f50057');
      nodeGrad.addColorStop(1, '#880e4f');

      ctx.fillStyle = nodeGrad;
      ctx.beginPath();
      ctx.ellipse(0, 1, 12, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function addTouchSparks(x, y) {
      for (let i = 0; i < 9; i++) {
        touchParticles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 4.5,
          vy: (Math.random() - 0.5) * 4.5,
          size: 2 + Math.random() * 3,
          life: 1
        });
      }
    }

    function animate() {
      time += 1;
      ctx.clearRect(0, 0, width, height);

      let bgGlow = ctx.createRadialGradient(width / 2, height * 0.48, 30, width / 2, height * 0.48, width * 0.7);
      bgGlow.addColorStop(0, 'rgba(123, 31, 162, 0.25)');
      bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = bgGlow;
      ctx.fillRect(0, 0, width, height);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      const isMobile = width < 768;
      const baseX = width / 2;
      const baseY = height * (isMobile ? 0.78 : 0.80);

      flowers.forEach(f => {
        f.update();
        f.draw(time, baseX, baseY);
      });

      // Малюємо красивий новий банчик
      drawElegantRibbon(baseX, baseY, time);

      for (let i = touchParticles.length - 1; i >= 0; i--) {
        let p = touchParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.025;
        if (p.life <= 0) {
          touchParticles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = '#ff80ab';
        ctx.shadowColor = '#ff4081';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('touchstart', (e) => {
      for (let touch of e.touches) {
        addTouchSparks(touch.clientX, touch.clientY);
      }
    });
    window.addEventListener('mousedown', (e) => {
      addTouchSparks(e.clientX, e.clientY);
    });

    resize();
    animate();
  </script>
</body>
</html>
